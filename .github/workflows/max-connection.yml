name: Max Connection installers

on:
  push:
    branches: [max-connection-installer]
    tags: ['max-connection-v*']
    paths: ['max-connection/**', '.github/workflows/max-connection.yml']
  pull_request:
    paths: ['max-connection/**', '.github/workflows/max-connection.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24 }
      - run: node --test max-connection/worker/test/enroll.test.mjs

  windows:
    needs: worker-tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_NAME -like 'max-connection-v*') { $env:GITHUB_REF_NAME -replace '^max-connection-v','' } else { '0.1.0' }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Lint PowerShell (parse only)
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem max-connection/windows/*.ps1) {
            $errs = $null; [void][Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | Out-String | Write-Error; exit 1 }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" max-connection/windows/MaxConnection.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: max-connection-windows
          path: dist/max-connection/*.exe
          if-no-files-found: error

  macos:
    needs: worker-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build package
        run: |
          V=0.1.0; case "$GITHUB_REF_NAME" in max-connection-v*) V="${GITHUB_REF_NAME#max-connection-v}";; esac
          bash -n max-connection/macos/scripts/postinstall
          bash max-connection/macos/build-pkg.sh "$V"
          pkgutil --check-signature dist/max-connection/*.pkg || true
          pkgutil --expand dist/max-connection/*.pkg /tmp/mc-expanded && ls -R /tmp/mc-expanded
      - uses: actions/upload-artifact@v4
        with:
          name: max-connection-macos
          path: dist/max-connection/*.pkg
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/max-connection-v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create draft release (never published by CI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --draft \
            --title "Max Connection ${GITHUB_REF_NAME#max-connection-v}" \
            --notes-file max-connection/RELEASE_NOTES.md
